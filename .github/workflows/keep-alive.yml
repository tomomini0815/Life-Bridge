name: Keep Supabase Alive

on:
  schedule:
    # 6時間ごとに実行 (0:00, 6:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # GitHubのUIから手動実行も可能にする

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Error: Missing environment variables VITE_SUPABASE_URL or VITE_SUPABASE_ANON_KEY in GitHub Secrets."
            exit 1
          fi
          
          echo "Sending ping to Supabase Database via REST API..."
          # 末尾のスラッシュを取り除いたクリーンなURLを作成
          CLEAN_URL=$(echo "$SUPABASE_URL" | sed 's/\/$//')
          
          # 単なるルートではなく、実テーブルまたはヘルスチェックAPIにクエリを投げてDBアクティビティを確実に発生させる
          response=$(curl -s -o /dev/null -w "%{http_code}" -X GET "$CLEAN_URL/rest/v1/memos?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          
          echo "Response HTTP Status: $response"
          
          if [ "$response" -eq 200 ] || [ "$response" -eq 206 ]; then
            echo "Successfully pinged Supabase DB (HTTP status $response). Database is active!"
          elif [ "$response" -eq 503 ]; then
            echo "::error::Supabase project appears to be PAUSED (HTTP 503). Please log into Supabase Dashboard and click 'Restore Project'."
            exit 1
          elif [ "$response" -ge 200 ] && [ "$response" -lt 500 ]; then
            echo "Reached Supabase API (HTTP status $response). Database is reachable."
          else
            echo "::error::Failed to connect to Supabase. HTTP Status Code: $response"
            exit 1
          fi
